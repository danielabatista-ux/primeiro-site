<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulários</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <h2>Formulários HTML</h2>
  <form action="register.php" method="get">
    <div>
      <label>Nome:</label>
      <input type="text" />
    </div>

    <!-- 3-Atributo name -->
    <div>
      <label>Idade:</label>
      <input type="text" name="age">
    </div>

    <!-- 4-Atributo label -->
    <div>
      <label for="age">Idade:</label>
      <input type="text" name="age">
    </div>

    <!-- 6-Select -->
    <div>
      <label for="job">Selecione a sua profissão:</label>
      <select name="job">
        <option value="programador">Programador</option>
        <option value="desenvolvedor">Desenvolvedor</option>
        <option value="analista de dados">Analista de dados</option>
      </select>
    </div>
    <!-- 7-Atributo selected -->

    <div>
      <label for="contrat">Voce leu os termos do contrato?</label>
      <select name="contrat">
        <option value="Sim">Sim</option>
        <option value="Não" selected>Não</option>
      </select>
    </div>
    <!-- 8-multiplas opções -->
    <div>
      <label for="Items">Selecione os itens desejados:</label>
      <select name="items" multiple>
        <option value="pera">Pera</option>
        <option value="feijão">Feijão</option>
        <option value="arroz">Arroz</option>
        <option value="milho">Milho</option>
      </select>
    </div>
    <!-- 9- Tag textarea -->
    <div>
      <label for="coment">Escreva abaixo o que você achou do post:</label>
      <textarea name="coment"></textarea>
    </div>
    <!-- 10- fieldset e legend -->
    <div>
      <fieldset>
        <legend>Preencha as suas informações:</legend>
        <label for="firstname">Nome:</label>
        <input type="text" name="firstname" </fieldset>
        <label for="lastname">Sobrenome</label>
        <input type="text" name="lastname" </fieldset>
    </div>
    <!-- 11- Datalist -->
    <div>
      <label for="flavor">Escolha o sabor:</label>
      <input type="text" list="flavors" name="flavor">

      <datalist id="flavors">
        <option value="Cereja"></option>
        <option value="Amora"></option>
        <option value="Chocolate"></option>

      </datalist>
    </div>
    <!-- 12-Senha -->
    <div>
      <label for="password">Digite sua senha:</label>
      <input type="password" name:password>

    </div>

    <!-- 14-Input radio -->
    <div>
      <label for="car_model">Escolha o modelo do seu carro:</label>
      <div class="radio">
        <input type="radio" value="BMW" name="car_model">
        <label for="BMW">BMW</label>
        <div>
          <div class="radio">
            <input type="radio" value="Ferrari" name="car_model">
            <label for="Ferrari">Ferrari</label>
          </div>
          <div class="radio">
            <input type="radio" value="Ferrari" name="car_model">
            <label for="Renault">Renault</label>
          </div>
        </div>

        <!-- 15- Checkbox  -->
        <div>
          <label for="optionals">Opcionais do carro:</label>
          <div class="radio">
            <input type="checkbox" name="optionals[]" value="big_tires">
            <label for="big_tires">Pneus Grandes</label>
          </div>
          <div class="radio">
            <input type="checkbox" name="optionals[]" value="turbo_engine">
            <label for="turbo_engine">Motor turbo</label>
          </div>
          <div class="radio">
            <input type="checkbox" name="optionals[]" value="hybrid">
            <label for="hybrid">Híbrido</label>
          </div>
        </div>

        <!-- 16- Date -->
        <div>
          <label for="birthday">Data de aniversário:</label>
          <input type="date" name="birthday">
        </div>

        <!-- 17-Arquivos -->
        <div>
          <label for="image">Insira a sua imagem</label>
          <input type="file" name="image">
        </div>
        <!-- 18- Input number -->
        <div>
          <label for="salary">Quanto você ganha no seu emprego atual?</label>
          <input type="number" name="salary">
        </div>
        <!-- 19-Input e-mail -->
        <div>
          <label for="email">Digiet seu e-mail:</label>
          <input type="email" name="email">
        </div>
        <!-- 20-Value -->
        <div>
          <label for="value">Digite algum valor:</label>
          <input type="text" value="O meu valor é este" name="value">
        </div>
        <!-- 21-Disabled -->
        <div>
          <p>Tente mudar o valor:</p>
          <input type="text" value="não precisa preencher" disabled>
          <!-- 22-Placehlder -->
          <div>
            <label for="current job">Digite a sua profissão:</label>
            <input type="text" name="current job" placeholder="no que você está trabalhando agora?">
          </div>
          <!-- 23- Required -->
          <div>
            <label for="birthyear">Ano de nascimento:</label>
            <input type="text" name="birthyear" placeholder="digite o seu ano de nascimento" required>
          </div>
          <!-- 13-Resetar form -->
          <input type="reset" value="Limpar" />
          <!-- 5-Envio de form -->
          <input type="submit" value="Enviar" />
  </form>

</body>

</html>
